[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `alembic` e `tests` non sono pacchetti dell'app; `documenti` e `motore` stanno in backend/ (vedi PYTHONPATH nel README)
packages = ["api", "api.routers"]

[project]
name = "esposti-api"
version = "0.1.0"
description = "Server applicativo del backoffice esposti ATS Insubria"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",   # client del motore
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `documenti` e `motore` sono pacchetti fratelli in backend/ (non vanno installati a parte)
pythonpath = [".", ".."]
